name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check-versions:
    name: check-versions
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check application major.minor versions
        run: python3 .github/scripts/versions.py
      - name: Test release safeguards (no network or publication)
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'

  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: sources/backend
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - run: dotnet restore Notable.slnx
      - name: Check formatting and Roslyn code style
        run: dotnet format Notable.slnx --verify-no-changes --no-restore
      - run: dotnet build Notable.slnx --configuration Release --no-restore
      - run: dotnet test Notable.slnx --configuration Release --no-build --no-restore

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: sources/webapp
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: sources/webapp/package-lock.json
      - run: npm ci
      - name: Lint, formatting and production build
        run: npm run check
      - run: npm test -- --watch=false
