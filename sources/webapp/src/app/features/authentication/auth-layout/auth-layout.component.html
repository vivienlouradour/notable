<main class="grid min-h-dvh bg-base-100 lg:grid-cols-3">
  <section
    class="flex min-w-0 flex-col px-6 py-6 sm:px-10 lg:order-last lg:px-8 xl:px-12"
    aria-labelledby="auth-title">
    <div class="flex items-center justify-between gap-4">
      <a routerLink="/notes" class="btn btn-ghost btn-sm gap-2">
        <svg lucideArrowLeft class="shrink-0 size-4" aria-hidden="true"></svg
        >{{ 'auth.backToNotes' | translate }}
      </a>
      <app-lang-switcher />
    </div>
    <div
      class="mx-auto flex w-full max-w-sm flex-1 flex-col justify-center py-12">
      <div class="mb-8">
        <div
          class="mb-6 flex size-12 items-center justify-center rounded-2xl bg-primary/10 text-2xl font-semibold text-primary"
          aria-hidden="true">
          N
        </div>
        <p class="mb-2 text-sm font-semibold tracking-widest text-primary">
          NOTABLE
        </p>
        <h1 id="auth-title" class="text-3xl font-semibold tracking-tight">
          {{ titleKey() | translate }}
        </h1>
        <p class="mt-3 text-sm leading-relaxed text-base-content/75">
          {{ subtitleKey() | translate }}
        </p>
      </div>

      <ng-content />
      <p class="mt-10 text-xs leading-relaxed text-base-content/75">
        {{ 'auth.localHint' | translate }}
      </p>
    </div>
  </section>
  <aside
    class="relative hidden overflow-hidden bg-linear-to-br from-base-200 via-primary/10 to-primary/25 lg:col-span-2 lg:flex lg:items-center lg:justify-center"
    aria-hidden="true">
    <div
      class="absolute -top-32 -right-24 size-112 rounded-full border border-primary/10"></div>
    <div
      class="absolute -bottom-48 -left-24 size-144 rounded-full border border-primary/10"></div>
    <div class="relative max-w-xl px-12 text-center">
      <div
        class="mx-auto mb-10 flex size-28 -rotate-6 items-center justify-center rounded-3xl border border-primary/15 bg-base-100/70 text-7xl font-semibold text-primary shadow-xl shadow-primary/5">
        N
      </div>
      <p class="text-5xl font-semibold tracking-tight text-base-content">
        Notable
      </p>
      <p
        class="mx-auto mt-6 max-w-sm text-xl leading-relaxed text-base-content/75">
        {{ 'auth.brandMessage' | translate }}
      </p>
      <p class="mt-12 text-sm tracking-wide text-base-content/75">
        {{ 'auth.brandValues' | translate }}
      </p>
    </div>
  </aside>
</main>
