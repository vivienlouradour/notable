<article class="list-row items-center gap-2 rounded-field hover:bg-base-200">
  <a
    class="list-col-grow flex min-w-0 items-center gap-3"
    [routerLink]="['/notes', note().id]">
    <span
      class="grid size-9 shrink-0 place-items-center rounded-field bg-primary/10 text-primary">
      <app-icon />
    </span>
    <span class="flex min-w-0 flex-1 flex-col gap-1">
      <strong class="truncate text-sm font-medium">{{
        note().title || ('notes.untitled' | translate)
      }}</strong>
      <span class="max-w-md truncate text-xs text-base-content/75">{{
        note().content || ('notes.noContent' | translate)
      }}</span>
    </span>
    <time
      class="hidden shrink-0 text-xs whitespace-nowrap text-base-content/75 content:inline">
      {{ note().metadata.createdAt | date: 'dd MMM yyyy' }}
    </time>
  </a>
  <button
    class="btn btn-ghost btn-square btn-sm text-base-content/75 hover:text-error"
    (click)="delete()"
    [title]="'notes.delete' | translate"
    [attr.aria-label]="('notes.delete' | translate) + ' ' + note().title">
    <app-icon name="trash" />
  </button>
</article>
